<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Digitação - Marcas e Logos</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #e8f4f8;
    color: #2c3e50;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Barra Superior estilo Digipuzzle */
  .top-bar {
    background-color: #ff7f00;
    color: #ffffff;
    padding: 10px 18px;
    border-bottom: 4px solid #cc6600;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

  .game-title {
    font-size: 22px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #b35900;
    margin: 4px 0;
  }

  .status-panel {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    margin: 4px 0;
  }

  .badge {
    background-color: #ffffff;
    color: #2c3e50;
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    border: 2px solid #cc6600;
    margin-right: 10px;
  }

  .badge span {
    color: #d35400;
  }

  .btn {
    background-color: #2980b9;
    color: #ffffff;
    border: 2px solid #1c5980;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }

  .btn:hover {
    background-color: #3498db;
  }

  .btn:active {
    transform: translateY(1px);
  }

  /* Área Principal */
  .main-container {
    flex: 1;
    max-width: 920px;
    width: 100%;
    margin: 12px auto;
    padding: 0 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .quiz-card {
    background-color: #ffffff;
    border: 4px solid #3498db;
    border-radius: 16px;
    padding: 16px 20px;
    width: 100%;
    margin-bottom: 14px;
    box-shadow: 0 4px 0 #bdd8e9;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 15px;
    color: #555555;
    font-weight: bold;
  }

  /* Caixa do Logotipo */
  .logo-box {
    width: 150px;
    height: 150px;
    margin: 4px auto 10px auto;
    background-color: #ffffff;
    border: 3px solid #dce6ef;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: hidden;
  }

  .logo-box svg,
  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Palavra Guia (Aparece após 10 segundos) */
  .word-guide {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #2c3e50;
    margin-bottom: 10px;
    min-height: 36px;
    line-height: 36px;
  }

  .word-guide.waiting-guide {
    color: #7f8c8d;
    font-size: 18px;
    letter-spacing: 0;
    font-weight: bold;
  }

  .countdown-pill {
    display: inline-block;
    background-color: #fff3cd;
    color: #b35900;
    border: 2px solid #ffecb5;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 16px;
    margin-left: 6px;
  }

  .guide-char-done {
    color: #27ae60;
  }

  .guide-char-current {
    color: #e67e22;
    text-decoration: underline;
  }

  /* Caixinhas de Letras */
  .letter-boxes {
    text-align: center;
    margin: 6px 0;
    min-height: 54px;
  }

  .word-group {
    display: inline-block;
    margin: 3px 8px;
  }

  .letter-slot {
    display: inline-block;
    width: 42px;
    height: 48px;
    margin: 0 3px;
    border: 3px solid #bdc3c7;
    border-radius: 8px;
    background-color: #f8f9fa;
    font-size: 26px;
    font-weight: bold;
    line-height: 42px;
    text-align: center;
    color: #2c3e50;
    vertical-align: middle;
  }

  .letter-slot.active-slot {
    border-color: #ff7f00;
    background-color: #fff8e7;
  }

  .letter-slot.filled-slot {
    border-color: #27ae60;
    background-color: #2ecc71;
    color: #ffffff;
  }

  .letter-slot.error-slot {
    border-color: #c0392b;
    background-color: #e74c3c;
    color: #ffffff;
  }

  .feedback-msg {
    min-height: 26px;
    font-size: 18px;
    font-weight: bold;
    color: #27ae60;
    margin-top: 4px;
  }

  /* Teclado Virtual Estilo Digipuzzle */
  .keyboard {
    background-color: #d6eaf8;
    border: 3px solid #85c1e9;
    border-radius: 14px;
    padding: 10px;
    width: 100%;
  }

  .kb-row {
    text-align: center;
    margin-bottom: 6px;
  }

  .kb-row:last-child {
    margin-bottom: 0;
  }

  .kb-key {
    display: inline-block;
    width: 52px;
    height: 46px;
    margin: 0 3px;
    background-color: #ffffff;
    border: 2px solid #5dade2;
    border-bottom-width: 4px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: bold;
    color: #2c3e50;
    cursor: pointer;
    line-height: 40px;
    text-align: center;
    vertical-align: middle;
  }

  .kb-key:hover {
    background-color: #ebf5fb;
  }

  .kb-key:active {
    transform: translateY(2px);
    border-bottom-width: 2px;
  }

  .kb-key.kb-space {
    width: 240px;
    font-size: 16px;
  }

  /* Modal de Fim de Jogo */
  .overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.65);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }

  .modal {
    background-color: #ffffff;
    border: 5px solid #ff7f00;
    border-radius: 18px;
    max-width: 480px;
    width: 100%;
    padding: 24px 20px;
    text-align: center;
  }

  .modal h2 {
    font-size: 28px;
    color: #d35400;
    margin-bottom: 10px;
  }

  .modal p {
    font-size: 18px;
    margin-bottom: 10px;
    color: #2c3e50;
  }

  .modal .big-score {
    font-size: 36px;
    font-weight: bold;
    color: #27ae60;
    margin: 14px 0;
  }

  .btn-big {
    background-color: #27ae60;
    border: 3px solid #1e8449;
    color: #ffffff;
    font-size: 20px;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
  }

  .btn-big:hover {
    background-color: #2ecc71;
  }

  /* Rodapé Discreto */
  footer {
    padding: 8px;
    font-size: 13px;
    color: #5d6d7e;
    background-color: #d6eaf8;
    border-top: 2px solid #aed6f1;
  }

  @media (max-width: 640px) {
    .kb-key {
      width: 30px;
      height: 38px;
      font-size: 15px;
      line-height: 32px;
      margin: 0 1px;
    }
    .letter-slot {
      width: 32px;
      height: 38px;
      font-size: 18px;
      line-height: 32px;
    }
  }
</style>
</head>
<body>

  <!-- Topo -->
  <div class="top-bar">
    <div class="game-title">&#9000; Quiz de Digitação: Logos</div>
    <div class="status-panel">
      <div class="badge">Pontos: <span id="scoreDisplay">0</span></div>
      <button class="btn" onclick="restartGame()">&#8635; Reiniciar</button>
    </div>
  </div>

  <!-- Área Central -->
  <div class="main-container">
    <div class="quiz-card">
      <div class="card-header">
        <span id="progressText">Logo 1 de 40</span>
        <span>Observe a logo e digite o nome!</span>
      </div>

      <div class="logo-box" id="logoContainer"></div>

      <div class="word-guide" id="wordGuide"></div>

      <div class="letter-boxes" id="letterBoxes"></div>

      <div class="feedback-msg" id="feedbackMsg"></div>
    </div>

    <!-- Teclado Virtual -->
    <div class="keyboard" id="virtualKeyboard"></div>
  </div>

  <!-- Tela Final -->
  <div class="overlay" id="endOverlay">
    <div class="modal">
      <h2 id="endTitle">&#127942; Parabéns!</h2>
      <p id="endSubtitle">Você completou todas as 40 marcas!</p>
      <div class="big-score" id="finalScoreText">40 palavras</div>
      <p id="accuracyText"></p>
      <button class="btn-big" onclick="restartGame()">Jogar Novamente</button>
    </div>
  </div>

  <footer>
    Feito pelo professor Marco Aurélio
  </footer>

// Estado do Jogo
var shuffledList = [];
var currentWordIndex = 0;
var currentCharIndex = 0;
var score = 0;
var totalKeystrokes = 0;
var correctKeystrokes = 0;
var isTransitioning = false;

// Controle dos 10 segundos para revelar o nome da marca
var hintSecondsLeft = 10;
var hintRevealed = false;
var hintTimerInterval = null;

// Normaliza letra (remove acentos e converte para minúscula)
function normalizeChar(ch) {
  if (!ch) return "";
  var lower = ch.toLowerCase();
  var map = {
    "á": "a", "à": "a", "ã": "a", "â": "a",
    "é": "e", "ê": "e",
    "í": "i",
    "ó": "o", "ô": "o", "õ": "o",
    "ú": "u", "ü": "u",
    "ç": "c"
  };
  return map[lower] || lower;
}

// Efeito sonoro simples
function playBeep(freq, duration) {
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!window._gameAudioCtx) {
      window._gameAudioCtx = new AudioCtx();
    }
    var ctx = window._gameAudioCtx;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    setTimeout(function() {
      try { osc.stop(); } catch (e) {}
    }, duration);
  } catch (e) {}
}

// Embaralha array (Fisher-Yates ES5)
function shuffleArray(arr) {
  var copy = arr.slice();
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

// Monta teclado virtual QWERTY (sem acender teclas)
function buildKeyboard() {
  var rows = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["Z","X","C","V","B","N","M"],
    ["ESPAÇO"]
  ];
  var container = document.getElementById("virtualKeyboard");
  var html = "";
  for (var r = 0; r < rows.length; r++) {
    html += '<div class="kb-row">';
    for (var k = 0; k < rows[r].length; k++) {
      var keyLabel = rows[r][k];
      if (keyLabel === "ESPAÇO") {
        html += '<div class="kb-key kb-space" onclick="handleVirtualKey(\' \')">ESPAÇO</div>';
      } else {
        html += '<div class="kb-key" onclick="handleVirtualKey(\'' + keyLabel + '\')">' + keyLabel + '</div>';
      }
    }
    html += '</div>';
  }
  container.innerHTML = html;
}

function handleVirtualKey(ch) {
  processTypedChar(ch);
}

// Inicia a contagem de 10 segundos para mostrar o nome da logo
function startWordHintCountdown() {
  if (hintTimerInterval) {
    clearInterval(hintTimerInterval);
    hintTimerInterval = null;
  }
  hintSecondsLeft = 10;
  hintRevealed = false;
  renderGuideAndBoxes();

  hintTimerInterval = setInterval(function() {
    hintSecondsLeft--;
    if (hintSecondsLeft <= 0) {
      clearInterval(hintTimerInterval);
      hintTimerInterval = null;
      hintRevealed = true;
      renderGuideAndBoxes();
    } else {
      renderGuideAndBoxes();
    }
  }, 1000);
}

// Renderiza a logo (usa o SVG fiel imediatamente e carrega ícone oficial caso haja internet)
function renderBrandLogo(brand) {
  var container = document.getElementById("logoContainer");
  container.innerHTML = brand.svg;
  if (brand.domain && navigator.onLine !== false) {
    var img = new Image();
    img.onload = function() {
      if (shuffledList[currentWordIndex] && shuffledList[currentWordIndex].name === brand.name && img.width >= 32) {
        container.innerHTML = "";
        container.appendChild(img);
      }
    };
    img.src = "https://www.google.com/s2/favicons?sz=128&domain=" + brand.domain;
  }
}

// Carrega a palavra atual
function loadCurrentWord() {
  if (currentWordIndex >= shuffledList.length) {
    endGame();
    return;
  }

  currentCharIndex = 0;
  isTransitioning = false;
  var brand = shuffledList[currentWordIndex];

  document.getElementById("progressText").innerHTML = "Logo " + (currentWordIndex + 1) + " de " + shuffledList.length;
  document.getElementById("feedbackMsg").innerHTML = "";

  renderBrandLogo(brand);
  startWordHintCountdown();
}

function renderGuideAndBoxes() {
  var brand = shuffledList[currentWordIndex];
  if (!brand) return;
  var word = brand.name;
  var guideEl = document.getElementById("wordGuide");

  // Só mostra o nome da marca após 10 segundos
  if (hintRevealed) {
    guideEl.className = "word-guide";
    var guideHtml = "";
    for (var i = 0; i < word.length; i++) {
      var ch = word.charAt(i);
      if (i < currentCharIndex) {
        guideHtml += '<span class="guide-char-done">' + ch + '</span>';
      } else if (i === currentCharIndex) {
        guideHtml += '<span class="guide-char-current">' + ch + '</span>';
      } else {
        guideHtml += '<span>' + ch + '</span>';
      }
    }
    guideEl.innerHTML = guideHtml;
  } else {
    guideEl.className = "word-guide waiting-guide";
    guideEl.innerHTML = 'Qual é o nome desta marca? <span class="countdown-pill">Nome em ' + hintSecondsLeft + 's</span>';
  }

  // Caixinhas de letras separadas por palavras
  var boxesEl = document.getElementById("letterBoxes");
  var html = '<div class="word-group">';
  for (var j = 0; j < word.length; j++) {
    var c = word.charAt(j);
    if (c === " ") {
      html += '</div><div class="word-group">';
    } else {
      var slotClass = "letter-slot";
      var displayChar = "";
      if (j < currentCharIndex) {
        slotClass += " filled-slot";
        displayChar = c;
      } else if (j === currentCharIndex) {
        slotClass += " active-slot";
      }
      html += '<div class="' + slotClass + '" id="slot-' + j + '">' + displayChar + '</div>';
    }
  }
  html += '</div>';
  boxesEl.innerHTML = html;
}

// Processa a letra digitada pelo aluno
function processTypedChar(typedChar) {
  if (isTransitioning) return;
  var brand = shuffledList[currentWordIndex];
  if (!brand) return;

  var word = brand.name;
  var expectedChar = word.charAt(currentCharIndex);

  if (expectedChar === " " && typedChar === " ") {
    currentCharIndex++;
    renderGuideAndBoxes();
    return;
  }

  if (expectedChar === " " && typedChar !== " ") {
    currentCharIndex++;
    expectedChar = word.charAt(currentCharIndex);
  }

  totalKeystrokes++;

  if (normalizeChar(typedChar) === normalizeChar(expectedChar)) {
    correctKeystrokes++;
    currentCharIndex++;
    playBeep(660, 60);

    while (currentCharIndex < word.length && word.charAt(currentCharIndex) === " ") {
      currentCharIndex++;
    }

    renderGuideAndBoxes();

    if (currentCharIndex >= word.length) {
      isTransitioning = true;
      if (hintTimerInterval) {
        clearInterval(hintTimerInterval);
        hintTimerInterval = null;
      }
      score++;
      document.getElementById("scoreDisplay").innerHTML = score;
      document.getElementById("feedbackMsg").innerHTML = "&#10004; Muito bem! " + word + "!";
      playBeep(880, 150);

      setTimeout(function() {
        currentWordIndex++;
        loadCurrentWord();
      }, 650);
    }
  } else {
    playBeep(220, 90);
    var activeSlot = document.getElementById("slot-" + currentCharIndex);
    if (activeSlot && activeSlot.className.indexOf("error-slot") === -1) {
      activeSlot.className += " error-slot";
      setTimeout(function() {
        if (activeSlot) {
          activeSlot.className = activeSlot.className.replace(" error-slot", "");
        }
      }, 250);
    }
  }
}

// Finaliza partida
function endGame() {
  if (hintTimerInterval) {
    clearInterval(hintTimerInterval);
    hintTimerInterval = null;
  }
  isTransitioning = true;

  var overlay = document.getElementById("endOverlay");
  var finalScore = document.getElementById("finalScoreText");
  var accText = document.getElementById("accuracyText");

  finalScore.innerHTML = score + " de " + shuffledList.length + " palavras";
  var acc = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;
  accText.innerHTML = "Precisão nas teclas: <strong>" + acc + "%</strong>";

  overlay.style.display = "flex";
}

// Reinicia todo o jogo
function restartGame() {
  if (hintTimerInterval) {
    clearInterval(hintTimerInterval);
    hintTimerInterval = null;
  }
  document.getElementById("endOverlay").style.display = "none";

  shuffledList = shuffleArray(BRANDS);
  currentWordIndex = 0;
  currentCharIndex = 0;
  score = 0;
  totalKeystrokes = 0;
  correctKeystrokes = 0;

  document.getElementById("scoreDisplay").innerHTML = "0";
  loadCurrentWord();
}

// Captura teclado físico (compatível com Pale Moon/Windows 7/Chrome)
document.onkeydown = function(evt) {
  evt = evt || window.event;
  if (evt.ctrlKey || evt.altKey || evt.metaKey) return;

  var key = evt.key;
  var code = evt.keyCode || evt.which;

  if (code === 32) {
    if (evt.preventDefault) evt.preventDefault();
    processTypedChar(" ");
    return false;
  }

  if (key && key.length === 1) {
    var norm = normalizeChar(key);
    if ((norm >= "a" && norm <= "z") || norm === " ") {
      processTypedChar(key);
    }
  } else if (code >= 65 && code <= 90) {
    var letter = String.fromCharCode(code);
    processTypedChar(letter);
  }
};

window.onload = function() {
  buildKeyboard();
  restartGame();
};
